<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{% block title %}CodeGuard{% endblock %}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
/* 顶栏 */
.tbar{display:flex;align-items:center;height:48px;background:#161b22;border-bottom:1px solid #30363d;padding:0 20px;gap:4px}
.tbar h1{font-size:16px;color:#58a6ff;margin-right:16px;font-weight:600}
.tbar .logo{cursor:pointer}
.tbtn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;text-decoration:none;transition:all .15s}
.tbtn:hover{background:#30363d}
.tbtn.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.tbar .hint{font-size:12px;color:#8b949e;margin-left:auto}
/* 内容 */
.wrap{max-width:960px;margin:0 auto;padding:32px 20px}
/* 卡片 */
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:24px;margin-bottom:20px}
.card h2{color:#58a6ff;font-size:16px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #30363d}
.card h3{color:#c9d1d9;font-size:14px;margin-bottom:8px}
/* 表单 */
.lbl{display:block;font-size:13px;color:#8b949e;margin-bottom:6px}
.inp{width:100%;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:10px 12px;border-radius:6px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.inp:focus{border-color:#58a6ff}
.btn{background:#238636;border:1px solid rgba(240,246,252,.1);color:#fff;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px;transition:background .15s}
.btn:hover{background:#2ea043}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* 统计格 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:16px;text-align:center}
.stat .num{font-size:24px;font-weight:700;color:#58a6ff;display:block}
.stat .lb{font-size:12px;color:#8b949e;margin-top:4px}
/* 列表 */
.lst{list-style:none}
.lst li{padding:8px 12px;border-bottom:1px solid #21262d;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.lst li:last-child{border-bottom:none}
.lst li:hover{background:#21262d;border-radius:4px}
.lst .nm{color:#c9d1d9}
.lst .vl{color:#8b949e;font-size:12px}
/* 消息 */
.msg{padding:12px 16px;border-radius:6px;font-size:13px;margin-bottom:16px}
.msg.err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:#f85149}
.msg.ok{background:rgba(46,160,67,.1);border:1px solid rgba(46,160,67,.3);color:#3fb950}
.msg.info{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);color:#58a6ff}
/* 代码 */
code{background:#21262d;padding:2px 6px;border-radius:4px;font-size:12px;color:#f0883e}
pre{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:16px;overflow-x:auto;font-size:13px;line-height:1.5;margin-top:8px;color:#c9d1d9}
/* 加载 */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
/* 链接 */
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}
/* 响应式 */
@media(max-width:640px){.wrap{padding:16px 12px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="tbar">
  <a href="/" class="logo" style="text-decoration:none"><h1>CodeGuard</h1></a>
  <a href="/" class="tbtn {% if request.url.path == '/' %}on{% endif %}">分析</a>
  <a href="/viz" class="tbtn {% if request.url.path == '/viz' %}on{% endif %}">可视化</a>
  <a href="/query" class="tbtn {% if request.url.path == '/query' %}on{% endif %}">问答</a>
  <span class="hint">代码知识图谱 Agent</span>
</div>
<div class="wrap">
{% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
